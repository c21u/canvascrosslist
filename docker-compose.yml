# version: "3"
services:
  web:
    build: .
    environment:
      NODE_ENV: production
      VIRTUAL_HOST: canvas-crosslist.127.0.0.1.nip.io
      BUZZAPI_URL: $BUZZAPI_URL
      CANVAS_LMS_API_URL: $CANVAS_LMS_API_URL
      LTI_KEY: gatech
      LTI_SECRET: doesitmatter
      BUZZAPI_APP_ID: $BUZZAPI_APP_ID
      BUZZAPI_PASSWORD: $BUZZAPI_PASSWORD
      CANVAS_TOKEN: $CANVAS_TOKEN
      TRUST_PROXY: uniquelocal
      JWT_SECRET: $JWT_SECRET
      LOG_LEVEL: $LOG_LEVEL
      SENTRY_DSN:
    labels:
      - "traefik.http.routers.whoami.rule=Host(`canvas-crosslist.127.0.0.1.nip.io`)"
      - "traefik.http.routers.whoami.tls=true"
    expose:
      - "3000"
  reverse-proxy:
    image: traefik:v2.0
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - $HOME/certs:/data/traefik
      - ./traefik:/etc/traefik
