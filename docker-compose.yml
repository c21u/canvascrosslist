services:
  web:
    build:
      context: .
      args:
        BUILD_FOR: dev
    environment:
      NODE_ENV: production
      BUZZAPI_URL: https://test.api.gatech.edu
      LTI_KEY: secret
      BUZZAPI_APP_ID: $BUZZAPI_APP_ID
      BUZZAPI_PASSWORD: $BUZZAPI_PASSWORD
      CANVAS_TOKEN: $CANVAS_TOKEN
      TRUST_PROXY: uniquelocal
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_HOST: db
      DB_NAME: ltijs_db
      DB_USER: postgres
      DB_PASS: crosslist
      CLIENT_ID_GATECH: 20960000000000445
    labels:
      - "traefik.http.routers.whoami.rule=Host(`dev.127.0.0.1.nip.io`)"
      - "traefik.http.routers.whoami.tls=true"
    develop:
      watch:
        - action: sync+restart
          path: server/
          target: /app/server/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: ./client
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: crosslist
      POSTGRES_USER: postgres
      POSTGRES_DB: ltijs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    labels:
      - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"
      - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.postgres.entrypoints=postgres"
      - "traefik.tcp.routers.postgres.service=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgresql://postgres:crosslist@localhost/ltijs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  reverse-proxy:
    image: traefik:v2.0
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "5432:5432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - $HOME/certs:/data/traefik:ro
      - ./traefik:/etc/traefik:ro
volumes:
  postgres_data:
